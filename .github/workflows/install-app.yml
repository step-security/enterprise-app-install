name: Install GitHub App to Organizations

on:
  # Manual trigger with optional inputs
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - only check installation status without installing'
        required: false
        default: 'false'
        type: boolean
  # Run when organizations.txt changes
  push:
    paths:
      - 'organizations.txt'

env:
  # Configure these values for your enterprise
  ENTERPRISE_SLUG: ${{ vars.ENTERPRISE_SLUG }}
  # Installer App - enterprise-level app with "Enterprise organization installations" permission
  INSTALLER_APP_CLIENT_ID: ${{ vars.INSTALLER_APP_CLIENT_ID }}
  # Optional client ID overrides for dedicated environments, where the apps have
  # different client IDs than the GitHub Cloud defaults. Leave unset to use the
  # GitHub Cloud defaults below.
  REGULAR_APP_CLIENT_ID: ${{ vars.REGULAR_APP_CLIENT_ID }}
  ADVANCED_APP_CLIENT_ID: ${{ vars.ADVANCED_APP_CLIENT_ID }}

permissions: {}

jobs:
  install-app:
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate JWT
        id: generate-jwt
        env:
          INSTALLER_APP_PRIVATE_KEY: ${{ secrets.INSTALLER_APP_PRIVATE_KEY }}
        run: |
          # Generate JWT for GitHub App authentication (using Installer App credentials)
          # Based on: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-json-web-token-jwt-for-a-github-app

          # Write private key to temp file (handles multi-line PEM format)
          KEY_FILE=$(mktemp)
          echo "${INSTALLER_APP_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          trap "rm -f ${KEY_FILE}" EXIT

          NOW=$(date +%s)
          IAT=$((NOW - 60))  # Issued 60 seconds ago to allow for clock drift
          EXP=$((NOW + 600)) # Expires in 10 minutes

          # Helper function for base64url encoding
          b64enc() { openssl base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n'; }

          # Create JWT header
          HEADER=$(echo -n '{"typ":"JWT","alg":"RS256"}' | b64enc)

          # Create JWT payload (iss is the Installer App's Client ID)
          PAYLOAD=$(echo -n "{\"iat\":${IAT},\"exp\":${EXP},\"iss\":\"${INSTALLER_APP_CLIENT_ID}\"}" | b64enc)

          # Sign the JWT
          HEADER_PAYLOAD="${HEADER}.${PAYLOAD}"
          SIGNATURE=$(echo -n "${HEADER_PAYLOAD}" | openssl dgst -sha256 -sign "${KEY_FILE}" | b64enc)

          JWT="${HEADER_PAYLOAD}.${SIGNATURE}"
          echo "jwt=${JWT}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${JWT}"

      - name: Get Enterprise Installation ID
        id: get-installation
        env:
          JWT: ${{ steps.generate-jwt.outputs.jwt }}
        run: |
          # Get the app's installation ID for the enterprise
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to get installations. HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          # Find the enterprise installation
          INSTALLATION_ID=$(echo "$BODY" | jq -r ".[] | select(.target_type == \"Enterprise\" and .account.slug == \"${ENTERPRISE_SLUG}\") | .id")

          if [ -z "$INSTALLATION_ID" ] || [ "$INSTALLATION_ID" == "null" ]; then
            echo "::error::No enterprise installation found for ${ENTERPRISE_SLUG}"
            exit 1
          fi

          echo "installation_id=${INSTALLATION_ID}" >> "$GITHUB_OUTPUT"
          echo "Found enterprise installation ID: ${INSTALLATION_ID}"

      - name: Get Installation Access Token
        id: get-token
        env:
          JWT: ${{ steps.generate-jwt.outputs.jwt }}
          INSTALLATION_ID: ${{ steps.get-installation.outputs.installation_id }}
        run: |
          # Get an installation access token
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Failed to get access token. HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | jq -r '.token')
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${TOKEN}"
          echo "Successfully obtained installation access token"

      - name: Install Apps to Organizations
        env:
          ACCESS_TOKEN: ${{ steps.get-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # Resolve app client IDs. Dedicated environments override these via the
          # REGULAR_APP_CLIENT_ID / ADVANCED_APP_CLIENT_ID variables; otherwise fall
          # back to the GitHub Cloud defaults.
          REGULAR_APP_CLIENT_ID="${REGULAR_APP_CLIENT_ID:-Iv1.ad96d1f00234487b}"
          ADVANCED_APP_CLIENT_ID="${ADVANCED_APP_CLIENT_ID:-Iv23liR5Z8C22IM5THOA}"

          # Define target apps to install (in order)
          APP_NAMES=(
            "StepSecurity Actions Security App"
            "StepSecurity App (Advanced App)"
          )
          APP_CLIENT_IDS=(
            "${REGULAR_APP_CLIENT_ID}"
            "${ADVANCED_APP_CLIENT_ID}"
          )

          # Read organizations from file (skip comments and empty lines)
          ORGS=$(grep -v '^#' organizations.txt | grep -v '^[[:space:]]*$' || true)

          if [ -z "$ORGS" ]; then
            echo "::warning::No organizations found in organizations.txt"
            exit 0
          fi

          echo "=== Processing organizations ==="
          echo "Apps to install (in order):"
          for i in "${!APP_NAMES[@]}"; do
            echo "  $((i+1)). ${APP_NAMES[$i]}"
          done
          echo ""

          INSTALLED=0
          ALREADY_INSTALLED=0
          UPDATED=0
          FAILED=0

          while IFS= read -r ORG; do
            # Trim whitespace
            ORG=$(echo "$ORG" | xargs)
            [ -z "$ORG" ] && continue

            echo ""
            echo "=========================================="
            echo "Processing organization: $ORG"
            echo "=========================================="

            # Get current installations for this org
            CHECK_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/enterprises/${ENTERPRISE_SLUG}/apps/organizations/${ORG}/installations")

            CHECK_HTTP_CODE=$(echo "$CHECK_RESPONSE" | tail -n1)
            CHECK_BODY=$(echo "$CHECK_RESPONSE" | sed '$d')

            if [ "$CHECK_HTTP_CODE" != "200" ]; then
              echo "::warning::Failed to check installations for $ORG (HTTP $CHECK_HTTP_CODE)"
            fi

            # Process each app in order
            for i in "${!APP_NAMES[@]}"; do
              APP_NAME="${APP_NAMES[$i]}"
              APP_CLIENT_ID="${APP_CLIENT_IDS[$i]}"
              echo ""
              echo "--- [$((i+1))/${#APP_NAMES[@]}] $APP_NAME ($APP_CLIENT_ID) ---"

              # Check if this app is already installed
              INSTALLATION_JSON=$(echo "$CHECK_BODY" | jq -c ".[]? | select(.client_id == \"${APP_CLIENT_ID}\")" 2>/dev/null || echo "")
              APP_INSTALLED=$(echo "$INSTALLATION_JSON" | jq -r '.id // empty' 2>/dev/null || echo "")

              if [ -n "$APP_INSTALLED" ] && [ "$APP_INSTALLED" != "null" ]; then
                # Installed - check for a pending permission update request.
                # The installation shows the permissions that were GRANTED;
                # GET /apps/{app_slug} shows what the app currently REQUESTS.
                # Any requested permission that is missing or lower on the
                # installation means an org admin has not yet accepted the
                # app's updated permissions.
                APP_SLUG=$(echo "$INSTALLATION_JSON" | jq -r '.app_slug // empty')
                GRANTED_PERMS=$(echo "$INSTALLATION_JSON" | jq -c '.permissions // {}')
                REPO_SELECTION=$(echo "$INSTALLATION_JSON" | jq -r '.repository_selection // "all"')

                MISSING_PERMS=""
                if [ -n "$APP_SLUG" ]; then
                  APP_RESPONSE=$(curl -s -w "\n%{http_code}" \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/apps/${APP_SLUG}")

                  APP_HTTP_CODE=$(echo "$APP_RESPONSE" | tail -n1)
                  APP_BODY=$(echo "$APP_RESPONSE" | sed '$d')

                  if [ "$APP_HTTP_CODE" == "200" ]; then
                    REQUESTED_PERMS=$(echo "$APP_BODY" | jq -c '.permissions // {}')
                    MISSING_PERMS=$(jq -n -r \
                      --argjson requested "$REQUESTED_PERMS" \
                      --argjson granted "$GRANTED_PERMS" '
                      def rank: {"read": 1, "write": 2, "admin": 3}[.] // 0;
                      [$requested | to_entries[]
                        | select((.value | rank) > (($granted[.key] // "none") | rank))
                        | "\(.key):\(.value)"]
                      | join(", ")')
                  else
                    echo "::warning::Could not fetch app manifest for ${APP_SLUG} (HTTP $APP_HTTP_CODE) - skipping permission update check"
                  fi
                fi

                if [ -z "$MISSING_PERMS" ]; then
                  echo "Already installed, permissions up to date (installation ID: $APP_INSTALLED)"
                  ALREADY_INSTALLED=$((ALREADY_INSTALLED + 1))
                elif [ "$DRY_RUN" == "true" ]; then
                  echo "[DRY RUN] Pending permission update (not yet granted: ${MISSING_PERMS}) - would accept"
                else
                  echo "Pending permission update detected (not yet granted: ${MISSING_PERMS})"

                  # Re-POSTing the install endpoint accepts a pending update
                  # request ("If the app is already installed and has a pending
                  # update request, it will be updated to the latest version").
                  # Preserve the existing repository selection so accepting the
                  # update does not change repository access.
                  INSTALL_PAYLOAD=""
                  if [ "$REPO_SELECTION" == "selected" ]; then
                    REPOS_JSON=$(curl -s \
                      -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "https://api.github.com/enterprises/${ENTERPRISE_SLUG}/apps/organizations/${ORG}/installations/${APP_INSTALLED}/repositories?per_page=100" \
                      | jq -c '[.[]?.name]' 2>/dev/null || echo "[]")
                    REPO_COUNT=$(echo "$REPOS_JSON" | jq 'length')

                    if [ "$REPO_COUNT" -lt 1 ] || [ "$REPO_COUNT" -gt 50 ]; then
                      # The install API accepts at most 50 repository names, so a
                      # larger "selected" installation cannot be updated without
                      # risking repository access changes.
                      echo "::warning::$ORG / $APP_NAME uses 'selected' repository access with ${REPO_COUNT} repos - accept the permission update manually in the org settings"
                      FAILED=$((FAILED + 1))
                    else
                      INSTALL_PAYLOAD=$(jq -n -c \
                        --arg cid "$APP_CLIENT_ID" \
                        --argjson repos "$REPOS_JSON" \
                        '{client_id: $cid, repository_selection: "selected", repositories: $repos}')
                    fi
                  else
                    INSTALL_PAYLOAD="{\"client_id\":\"${APP_CLIENT_ID}\",\"repository_selection\":\"all\"}"
                  fi

                  if [ -n "$INSTALL_PAYLOAD" ]; then
                    UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
                      -X POST \
                      -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      -d "$INSTALL_PAYLOAD" \
                      "https://api.github.com/enterprises/${ENTERPRISE_SLUG}/apps/organizations/${ORG}/installations")

                    UPDATE_HTTP_CODE=$(echo "$UPDATE_RESPONSE" | tail -n1)
                    UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | sed '$d')

                    if [ "$UPDATE_HTTP_CODE" == "201" ] || [ "$UPDATE_HTTP_CODE" == "200" ]; then
                      echo "Accepted updated permissions"
                      UPDATED=$((UPDATED + 1))
                    else
                      echo "::warning::Failed to accept updated permissions. HTTP $UPDATE_HTTP_CODE: $UPDATE_BODY"
                      FAILED=$((FAILED + 1))
                    fi
                  fi
                fi
              else
                if [ "$DRY_RUN" == "true" ]; then
                  echo "[DRY RUN] Would install"
                else
                  # Install the app
                  INSTALL_RESPONSE=$(curl -s -w "\n%{http_code}" \
                    -X POST \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -d "{\"client_id\":\"${APP_CLIENT_ID}\",\"repository_selection\":\"all\"}" \
                    "https://api.github.com/enterprises/${ENTERPRISE_SLUG}/apps/organizations/${ORG}/installations")

                  INSTALL_HTTP_CODE=$(echo "$INSTALL_RESPONSE" | tail -n1)
                  INSTALL_BODY=$(echo "$INSTALL_RESPONSE" | sed '$d')

                  if [ "$INSTALL_HTTP_CODE" == "201" ] || [ "$INSTALL_HTTP_CODE" == "200" ]; then
                    echo "Successfully installed"
                    INSTALLED=$((INSTALLED + 1))
                  elif [ "$INSTALL_HTTP_CODE" == "422" ]; then
                    echo "Already installed (confirmed via install attempt)"
                    ALREADY_INSTALLED=$((ALREADY_INSTALLED + 1))
                  else
                    echo "::warning::Failed to install. HTTP $INSTALL_HTTP_CODE: $INSTALL_BODY"
                    FAILED=$((FAILED + 1))
                  fi
                fi
              fi

              # Sleep 5 seconds between apps (not after the last one)
              if [ "$i" -lt "$((${#APP_NAMES[@]} - 1))" ]; then
                echo "Waiting 5 seconds before next app..."
                sleep 5
              fi
            done

          done <<< "$ORGS"

          echo ""
          echo "=== Summary ==="
          echo "Newly installed: $INSTALLED"
          echo "Already installed: $ALREADY_INSTALLED"
          echo "Permission updates accepted: $UPDATED"
          echo "Failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::Some installations failed. Check the logs above for details."
          fi
